<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirma tu asistencia — Juan Antonio & Anahí</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#F8F4EE;
    --blush:#F1E0D6;
    --arena:#D8C4AE;
    --terracota:#C1815B;
    --gris-calido:#B4A99B;
    --texto:#3B2A22;
    --verde-ok:#5C7A5A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--crema);
    color:var(--texto);
    font-family:'Work Sans', sans-serif;
    font-weight:300;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    line-height:1.6;
  }
  h1, h2, .serif{font-family:'Fraunces', serif; font-weight:600;}

  .tarjeta{
    background:#fff;
    border:1px solid var(--arena);
    max-width:480px;
    width:100%;
    padding:40px 32px;
    text-align:center;
  }

  .tarjeta h1{font-size:1.5rem; margin-bottom:8px;}
  .subtitulo{color:var(--gris-calido); font-size:0.95rem; margin-bottom:28px;}

  .lugares{
    background:var(--blush);
    padding:14px;
    font-size:0.95rem;
    margin-bottom:28px;
  }
  .lugares strong{color:var(--terracota);}

  /* -------- botones de decisión inicial -------- */
  .opciones{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn{
    padding:14px 20px;
    border:1px solid var(--terracota);
    background:none;
    color:var(--texto);
    font-family:inherit;
    font-size:0.95rem;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
    width:100%;
  }
  .btn:hover{background:var(--terracota); color:#fff;}
  .btn-principal{background:var(--terracota); color:#fff;}
  .btn-principal:hover{opacity:0.9;}
  .btn-texto{
    border:none;
    background:none;
    color:var(--gris-calido);
    text-decoration:underline;
    font-size:0.85rem;
    cursor:pointer;
    margin-top:14px;
  }

  /* -------- formulario -------- */
  .campo{
    text-align:left;
    margin-bottom:18px;
  }
  .campo label{
    display:block;
    font-size:0.85rem;
    margin-bottom:6px;
    color:var(--gris-calido);
  }
  .campo input[type="number"],
  .campo textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--arena);
    background:var(--crema);
    font-family:inherit;
    font-size:0.95rem;
    resize:vertical;
  }
  .campo textarea{min-height:70px;}

  /* -------- estados -------- */
  .oculto{display:none;}
  .mensaje-final .icono{font-size:2.4rem; margin-bottom:12px;}
  .mensaje-final p{color:var(--gris-calido); font-size:0.95rem;}
  #error-box{color:#B15D4A;}
</style>
</head>
<body>

<div class="tarjeta" id="tarjeta">
  <div id="cargando">
    <p>Cargando tu invitación…</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const tarjeta = document.getElementById("tarjeta");
  const params = new URLSearchParams(window.location.search);
  const famId = params.get("fam");

  let familiaActual = null;

  async function iniciar() {
    if (!famId) {
      mostrarError("Este link no incluye una invitación válida. Revisa que hayas copiado el link completo.");
      return;
    }

    try {
      const snap = await getDoc(doc(db, "familias", famId));
      if (!snap.exists()) {
        mostrarError("No encontramos esta invitación. Si crees que es un error, contáctanos directamente.");
        return;
      }
      familiaActual = { id: snap.id, ...snap.data() };

      const resp = params.get("resp");
      if (resp === "confirmar") {
        mostrarFormularioConfirma();
      } else if (resp === "decline") {
        mostrarFormularioDecline();
      } else {
        mostrarBienvenida();
      }
    } catch (err) {
      mostrarError("Ocurrió un problema cargando tu invitación. Intenta de nuevo en un momento.");
    }
  }

  function mostrarError(texto) {
    tarjeta.innerHTML = `<div id="error-box"><p>${texto}</p></div>`;
  }

  function mostrarBienvenida() {
    const f = familiaActual;
    const yaRespondio = f.estado === "confirmado" || f.estado === "cancelado";

    tarjeta.innerHTML = `
      <h1 class="serif">Hola, ${f.contacto_nombre}</h1>
      <p class="subtitulo">Nos encantaría contar con ustedes en nuestra boda</p>
      <div class="lugares">Tienen <strong>${f.personas_esperadas}</strong> ${f.personas_esperadas == 1 ? "lugar reservado" : "lugares reservados"}</div>

      ${yaRespondio ? `
        <p style="margin-bottom:20px; font-size:0.9rem; color:var(--gris-calido);">
          Ya nos habían avisado: <strong style="color:var(--texto);">${f.estado === "confirmado" ? "asistirán" : "no podrán asistir"}</strong>.
        </p>
      ` : ""}

      <div class="opciones">
        <button class="btn btn-principal" id="btn-si">Sí, ahí estaremos</button>
        <button class="btn" id="btn-no">No podremos acompañarlos</button>
      </div>
    `;

    document.getElementById("btn-si").addEventListener("click", mostrarFormularioConfirma);
    document.getElementById("btn-no").addEventListener("click", mostrarFormularioDecline);
  }

  function mostrarFormularioConfirma() {
    const f = familiaActual;
    tarjeta.innerHTML = `
      <h1 class="serif">¡Qué alegría!</h1>
      <p class="subtitulo">Cuéntanos los detalles para reservar bien los lugares</p>

      <div class="campo">
        <label for="input-personas">¿Cuántos de sus ${f.personas_esperadas} lugares asistirán?</label>
        <input type="number" id="input-personas" min="1" max="${f.personas_esperadas}" value="${f.personas_esperadas}">
      </div>

      <div class="campo">
        <label for="input-nombres">Nombres de quienes asisten (opcional)</label>
        <textarea id="input-nombres" placeholder="Uno por línea">${(f.nombres || []).join("\n")}</textarea>
      </div>

      <div class="campo">
        <label for="input-alergias">¿Alguien tiene alguna alergia o restricción alimenticia?</label>
        <textarea id="input-alergias" placeholder="Ej. uno es alérgico a los mariscos, o 'ninguna'">${f.alergias || ""}</textarea>
      </div>

      <div class="campo">
        <label for="input-mensaje">Mensaje para los novios (opcional)</label>
        <textarea id="input-mensaje">${f.mensaje || ""}</textarea>
      </div>

      <button class="btn btn-principal" id="btn-enviar-confirma">Confirmar asistencia</button>
      <button class="btn-texto" id="btn-volver">← Volver</button>
    `;

    document.getElementById("btn-volver").addEventListener("click", mostrarBienvenida);
    document.getElementById("btn-enviar-confirma").addEventListener("click", async () => {
      const personas = Math.min(
        Math.max(parseInt(document.getElementById("input-personas").value) || 1, 1),
        f.personas_esperadas
      );
      const nombres = document.getElementById("input-nombres").value
        .split("\n").map(n => n.trim()).filter(Boolean);
      const alergias = document.getElementById("input-alergias").value.trim();
      const mensaje = document.getElementById("input-mensaje").value.trim();

      await guardarRespuesta({
        estado: "confirmado",
        personas_confirmadas: personas,
        nombres,
        alergias,
        mensaje
      });
      mostrarGracias("¡Los esperamos! 🎉", "Guardamos tu confirmación, nos vemos en la boda.");
    });
  }

  function mostrarFormularioDecline() {
    const f = familiaActual;
    tarjeta.innerHTML = `
      <h1 class="serif">Los vamos a extrañar</h1>
      <p class="subtitulo">Gracias por avisarnos con tiempo</p>

      <div class="campo">
        <label for="input-mensaje-decline">¿Quieren dejarnos un mensaje? (opcional)</label>
        <textarea id="input-mensaje-decline">${f.mensaje || ""}</textarea>
      </div>

      <button class="btn btn-principal" id="btn-enviar-decline">Enviar respuesta</button>
      <button class="btn-texto" id="btn-volver">← Volver</button>
    `;

    document.getElementById("btn-volver").addEventListener("click", mostrarBienvenida);
    document.getElementById("btn-enviar-decline").addEventListener("click", async () => {
      const mensaje = document.getElementById("input-mensaje-decline").value.trim();
      await guardarRespuesta({
        estado: "cancelado",
        personas_confirmadas: 0,
        mensaje
      });
      mostrarGracias("Gracias por avisarnos", "Lamentamos que no puedan acompañarnos, ¡los queremos igual!");
    });
  }

  async function guardarRespuesta(cambios) {
    await updateDoc(doc(db, "familias", familiaActual.id), cambios);
    familiaActual = { ...familiaActual, ...cambios };
  }

  function mostrarGracias(titulo, texto) {
    tarjeta.innerHTML = `
      <div class="mensaje-final">
        <div class="icono">💌</div>
        <h1 class="serif">${titulo}</h1>
        <p>${texto}</p>
        <button class="btn-texto" id="btn-cambiar">¿Necesitas cambiar tu respuesta? Haz clic aquí</button>
      </div>
    `;
    document.getElementById("btn-cambiar").addEventListener("click", mostrarBienvenida);
  }

  iniciar();
</script>

</body>
</html>
